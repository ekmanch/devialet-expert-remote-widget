<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devialet Flyout Mockup v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e10;
    --surface:#1a1a1d;
    --surface-2:#222225;
    --surface-3:#2a2a2e;
    --copper:#c17f4e;
    --copper-bright:#e3a06a;
    --copper-dim:#8a5c39;
    --text:#f2f0ec;
    --text-dim:#9a9a9f;
    --text-faint:#5c5c60;
    --divider:rgba(255,255,255,0.08);
    --danger:#b5544a;
    --success:#5fa374;
    --success-bright:#7bc796;
    --warning:#a3813a;
    --warning-bright:#e0b563;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(193,127,78,0.06), transparent 60%),
      repeating-linear-gradient(90deg, #0a0a0c 0 40px, #0b0b0d 40px 80px),
      #0a0a0c;
    min-height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    padding:52px 48px 0 0;
  }

  .desktop-panel{
    position:fixed; top:0; left:0; right:0; height:34px;
    background:rgba(20,20,22,0.92);
    border-bottom:1px solid var(--divider);
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 14px; gap:14px;
    backdrop-filter:blur(6px);
    z-index:5;
  }
  .panel-icon{width:16px; height:16px; border-radius:4px; opacity:0.55; background:var(--text-faint);}
  .panel-icon.devialet{
    background:transparent; opacity:1;
    display:flex; align-items:center; justify-content:center;
    color:var(--copper-bright); font-size:13px; cursor:pointer;
  }
  .panel-clock{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); letter-spacing:0.02em;}
  .mockup-tag{
    position:fixed; top:44px; right:14px; z-index:60;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.06em;
    color:var(--text-faint); background:rgba(0,0,0,0.5); padding:3px 7px; border-radius:6px;
    border:1px solid var(--divider); pointer-events:none;
  }

  .flyout-wrap{ position:relative; margin-top:6px; }
  .nub{
    position:absolute; top:-7px; right:22px; width:14px; height:14px;
    background:linear-gradient(135deg,#18181a,#141416);
    border-left:1px solid rgba(255,255,255,0.08); border-top:1px solid rgba(255,255,255,0.08);
    transform:rotate(45deg); border-radius:3px 0 0 0;
  }
  .flyout{
    width:300px; position:relative;
    --panel-alpha:1;
    background:linear-gradient(180deg, rgba(23,23,26,var(--panel-alpha)) 0%, rgba(18,18,20,var(--panel-alpha)) 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
    animation:pop .16s cubic-bezier(.2,.9,.3,1);
  }
  .flyout.blur-enabled{
    backdrop-filter:blur(18px) saturate(140%);
  }
  .settings-row-sub{ padding-top:0; margin-top:-4px; transition:opacity .15s ease; }
  @keyframes pop{from{opacity:0; transform:translateY(-4px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}

  .settings-trigger{
    position:absolute; top:10px; right:10px; z-index:3;
    width:24px; height:24px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:15px; cursor:pointer;
    letter-spacing:1px;
  }
  .settings-trigger:hover{background:var(--surface-2); color:var(--copper-bright);}

  /* ---- Amp header (clickable -> expands amp list) ---- */
  .amp-header{
    display:flex; align-items:center; gap:10px;
    padding:14px 40px 12px 16px;
    border-bottom:1px solid var(--divider);
    cursor:pointer;
  }
  .amp-header:hover{background:rgba(255,255,255,0.02);}
  .amp-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--copper-bright); box-shadow:0 0 7px 2px rgba(227,160,106,0.5);
    flex-shrink:0;
  }
  .amp-dot.none{background:transparent; box-shadow:none; border:1.5px dashed var(--text-faint);}
  .amp-dot.booting{
    background:var(--warning-bright); box-shadow:0 0 7px 2px rgba(224,181,99,0.5);
    animation:dotPulse 1.1s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .spinner{
    width:13px; height:13px; border-radius:50%;
    border:2px solid rgba(224,181,99,0.25); border-top-color:var(--warning-bright);
    animation:spin 0.7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .header-text{flex:1; min-width:0;}
  .header-eyebrow{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-faint); margin:0 0 2px;
  }
  .header-name{
    font-family:var(--font-display); font-weight:600; font-size:13.5px; margin:0 0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-sub{
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-caret{
    color:var(--text-faint); font-size:11px; flex-shrink:0; transition:transform .16s ease;
  }
  .header-caret.open{transform:rotate(180deg); color:var(--copper-bright);}

  /* ---- Amp list: implemented as QtQuick.Controls.Popup, reparented
     into the flyout window's Overlay.overlay when open — renders on
     top of the rest of the flyout content rather than pushing it
     down, so it's an absolutely-positioned floating panel here. ---- */
  .overlay-popup{
    position:absolute; left:16px; right:16px;
    background:linear-gradient(180deg,#1e1e21 0%, #19191c 100%);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:13px;
    box-shadow:0 18px 44px -10px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.4);
    z-index:30;
    display:none;
    overflow-y:auto;
    max-height:230px;
  }
  .overlay-popup.open{
    display:block;
    animation:popupIn .14s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes popupIn{
    from{opacity:0; transform:translateY(-6px) scale(0.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .amp-list-inner{ padding:8px; }
  .amp-option{
    display:flex; align-items:center; gap:9px; padding:8px 8px; border-radius:9px; cursor:pointer;
  }
  .amp-option:hover{background:var(--surface-2);}
  .amp-option-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .amp-option.connected .amp-option-dot{ background:var(--copper-bright); box-shadow:0 0 6px 1px rgba(227,160,106,0.5); }
  .amp-option-info{ flex:1; min-width:0; }
  .amp-option-name{ font-size:12.5px; font-weight:600; margin:0; color:var(--text-dim); }
  .amp-option.connected .amp-option-name{ color:var(--copper-bright); }
  .amp-option-sub{ font-size:10px; color:var(--text-faint); font-family:var(--font-mono); margin:0; }
  .amp-option-check{ font-size:11px; color:var(--copper-bright); opacity:0; }
  .amp-option.connected .amp-option-check{ opacity:1; }

  /* Volume block */
  .vol-block{padding:16px 16px 6px;}
  .vol-readout-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .vol-readout{
    font-family:var(--font-mono); font-size:26px; font-weight:500; color:var(--copper-bright);
    font-variant-numeric:tabular-nums; letter-spacing:-0.01em;
    text-shadow:0 0 14px rgba(227,160,106,0.3);
  }
  .vol-unit{font-size:12px; color:var(--text-dim); font-weight:400; margin-left:3px;}
  .vol-source-chip{
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
    background:var(--surface); border:1px solid var(--divider); border-radius:999px;
    padding:3px 9px;
  }
  .vol-slider-row{display:flex; align-items:center; gap:10px;}
  input[type="range"].copper-slider{
    -webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:999px;
    background:linear-gradient(90deg, var(--copper) 0%, var(--copper) var(--fill,55%), var(--surface-3) var(--fill,55%), var(--surface-3) 100%);
    outline:none; margin:0; cursor:default;
  }
  input[type="range"].copper-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--copper-bright); box-shadow:0 0 0 3px rgba(227,160,106,0.18), 0 1px 3px rgba(0,0,0,0.5);
    cursor:default;
  }
  .step-btn{
    width:26px; height:26px; border-radius:8px; background:var(--surface); border:1px solid var(--divider);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600;
    font-size:14px; color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .step-btn:hover{border-color:var(--copper-dim); color:var(--copper-bright);}
  .scroll-hint{
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
    margin:9px 0 0; text-align:center; letter-spacing:0.01em;
  }

  .action-row{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 16px 4px;}
  .action-btn{
    background:var(--surface); border:1px solid var(--divider); border-radius:11px; height:38px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12px; font-weight:600; letter-spacing:0.01em; cursor:pointer; color:var(--text);
  }
  .action-btn:hover{border-color:var(--copper-dim);}
  .action-btn.active{background:rgba(193,127,78,0.14); border-color:var(--copper-dim); color:var(--copper-bright);}
  .action-btn.power-btn.state-on:hover{border-color:var(--danger); color:var(--danger);}
  .action-btn.power-btn.state-off:hover{border-color:var(--success); color:var(--success-bright);}
  .action-btn.power-btn.state-booting{
    border-color:var(--warning); color:var(--warning-bright);
    cursor:default; pointer-events:none;
  }
  .icon{width:13px; height:13px; flex-shrink:0;}

  .source-block{padding:10px 16px 14px;}
  .source-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    background:var(--surface); border:1px solid var(--divider); border-radius:11px; cursor:pointer;
  }
  .source-row:hover{border-color:var(--copper-dim);}
  .source-icon-sm{
    width:24px; height:24px; border-radius:7px; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; color:var(--copper-bright); font-size:12px; flex-shrink:0;
  }
  .source-label{flex:1; min-width:0;}
  .source-eyebrow{font-size:9.5px; color:var(--text-faint); font-family:var(--font-mono); margin:0 0 1px; letter-spacing:0.04em;}
  .source-name{font-size:13px; font-weight:600; margin:0;}
  .source-caret{color:var(--text-faint); font-size:11px; transition:transform .16s ease;}
  .source-caret.open{transform:rotate(180deg); color:var(--copper-bright);}
  /* ---- Source list: implemented as PlasmaComponents3.ComboBox.
     Its popup also reparents into Overlay.overlay when open. Since
     the source row sits near the bottom of the flyout, the popup
     opens upward over the volume/action rows rather than downward
     off the edge of the window — same as a real ComboBox flipping
     direction when there's no room below. ---- */
  .source-list.overlay-popup{ top:auto; bottom:72px; max-height:252px; }
  .source-option{
    display:flex; align-items:center; gap:9px; padding:8px 10px; margin:4px;
    border-radius:9px; font-size:12.5px; cursor:pointer; color:var(--text-dim);
  }
  .source-option:hover{background:var(--surface-2);}
  .source-option.selected{color:var(--copper-bright);}
  .source-option .source-icon-sm{width:20px; height:20px; font-size:10px;}
  .source-check{margin-left:auto; font-size:11px; opacity:0;}
  .source-option.selected .source-check{opacity:1;}

  .flyout-footer{
    padding:9px 16px 11px; border-top:1px solid var(--divider);
    display:flex; align-items:center; justify-content:center;
  }
  .footer-status{font-family:var(--font-mono); font-size:10px; color:var(--text-faint);}
  .footer-status.ok::before{
    content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--copper-bright); margin-right:5px; box-shadow:0 0 5px 1px rgba(227,160,106,0.5);
  }

</style>
</head>
<body>

<div class="desktop-panel">
  <div class="panel-icon"></div>
  <div class="panel-icon"></div>
  <div class="panel-icon devialet" id="trayIcon" onclick="toggleFlyout()">◉</div>
  <div class="panel-icon"></div>
  <div class="panel-clock">14:32</div>
</div>
<div class="mockup-tag">MOCKUP · POPUP/COMBOBOX OVERLAY BEHAVIOR</div>

<div class="flyout-wrap" id="flyoutWrap">
  <div class="nub"></div>
  <div class="flyout" id="flyoutPanel">

    <div class="settings-trigger" id="settingsTrigger" title="Settings">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>

    <!-- ============ MAIN VIEW ============ -->
    <div class="main-view" id="mainView">

      <div class="amp-header" id="ampHeader" onclick="toggleAmpList()">
        <div class="amp-dot" id="ampDot"></div>
        <div class="header-text">
          <p class="header-eyebrow">Devialet</p>
          <p class="header-name" id="ampName">Expert 140 Pro</p>
          <p class="header-sub" id="ampSub">192.168.0.22 · Connected</p>
        </div>
        <div class="header-caret" id="ampCaret">⌄</div>
      </div>

      <div class="overlay-popup" id="ampList" style="top:64px;">
        <div class="amp-list-inner" id="ampListInner"></div>
      </div>

      <div class="vol-block">
        <div class="vol-readout-row">
          <div><span class="vol-readout" id="volValue">−25.0</span><span class="vol-unit">dB</span></div>
          <div class="vol-source-chip" id="volSourceChip">Optical 1</div>
        </div>
        <div class="vol-slider-row">
          <div class="step-btn" onclick="stepVol(-0.5)">−</div>
          <input type="range" class="copper-slider" id="volSlider" min="-60" max="-15" step="0.5" value="-25" style="--fill:77.8%" oninput="onVolInput(this.value)">
          <div class="step-btn" onclick="stepVol(0.5)">+</div>
        </div>
        <p class="scroll-hint">Scroll over the tray icon to adjust</p>
      </div>

      <div class="action-row">
        <div class="action-btn" id="muteBtn" onclick="toggleMute()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <span>Mute</span>
        </div>
        <div class="action-btn power-btn state-on" id="powerBtn" onclick="togglePower()">
          <svg class="icon" id="powerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          <div class="spinner" id="powerSpinner" style="display:none;"></div>
          <span id="powerLabel">Power Off</span>
        </div>
      </div>

      <div class="source-block">
        <div class="source-row" onclick="toggleSourceList()">
          <div class="source-icon-sm">◉</div>
          <div class="source-label">
            <p class="source-eyebrow">Source</p>
            <p class="source-name" id="sourceRowName">Optical 1</p>
          </div>
          <div class="source-caret" id="sourceCaret">⌄</div>
        </div>
        <div class="overlay-popup source-list" id="sourceList"></div>
      </div>

      <div class="flyout-footer">
        <span class="footer-status ok" id="footerStatus">Updated 1s ago</span>
      </div>
    </div>

  </div>
</div>

<script>
  // ---- Amplifier model: mirrors Android app's resolution logic ----
  // Each amp has:
  //   udpName    - name reported directly in the UDP status broadcast (always present once discovered)
  //   modelName  - resolved via mDNS (AmpModelNameResolver), null until/unless resolved
  //   ip, connected
  // Display name = modelName if resolved, else udpName (same fallback as MainActivity.kt / device card)
  const amplifiers = [
    {udpName:'My Devialet', modelName:'Devialet Expert 140 Pro', ip:'192.168.0.22', connected:true},
    {udpName:'Living Room Expert', modelName:'Devialet Expert 220 Pro', ip:'192.168.0.31', connected:false},
    {udpName:'Studio Phantom', modelName:null, ip:'192.168.0.44', connected:false} // mDNS not resolved yet - UDP name fallback
  ];
  function displayName(a){ return a.modelName || a.udpName; }

  const sources = [
    {name:'Optical 1', icon:'◉'},
    {name:'UPnP', icon:'◫'},
    {name:'Roon Ready', icon:'◍'},
    {name:'AirPlay', icon:'◈'},
    {name:'Spotify', icon:'◐'},
    {name:'AIR', icon:'◇'},
  ];
  let currentSource = 'Optical 1';
  let sourceListOpen = false;
  let ampListOpen = false;
  let muted = false;
  let poweredOn = true;
  let vol = -25.0;
  const MIN_DB = -60, MAX_DB = -15;

  function renderAmpHeader(){
    const active = amplifiers.find(a=>a.connected);
    document.getElementById('ampName').textContent = displayName(active);
    document.getElementById('ampSub').textContent = active.ip + ' · Connected';
  }
  function renderAmpList(){
    const inner = document.getElementById('ampListInner');
    inner.innerHTML = '';
    amplifiers.forEach(a=>{
      const div = document.createElement('div');
      div.className = 'amp-option' + (a.connected ? ' connected' : '');
      div.innerHTML = `<div class="amp-option-dot"></div>
        <div class="amp-option-info">
          <p class="amp-option-name">${displayName(a)}</p>
          <p class="amp-option-sub">${a.ip}${a.modelName ? '' : ' · name unresolved'}</p>
        </div>
        <span class="amp-option-check">✓</span>`;
      div.onclick = (e)=>{ e.stopPropagation(); selectAmp(a); };
      inner.appendChild(div);
    });
  }
  function selectAmp(a){
    amplifiers.forEach(x=> x.connected = (x===a));
    renderAmpHeader();
    renderAmpList();
    toggleAmpList();
  }
  function toggleAmpList(){
    ampListOpen = !ampListOpen;
    document.getElementById('ampList').classList.toggle('open', ampListOpen);
    document.getElementById('ampCaret').classList.toggle('open', ampListOpen);
    if(ampListOpen && sourceListOpen){ toggleSourceList(); }
  }

  function renderSourceList(){
    const list = document.getElementById('sourceList');
    list.innerHTML = '';
    sources.forEach(s=>{
      const div = document.createElement('div');
      div.className = 'source-option' + (s.name===currentSource ? ' selected' : '');
      div.innerHTML = `<div class="source-icon-sm">${s.icon}</div><span>${s.name}</span><span class="source-check">✓</span>`;
      div.onclick = (e)=>{ e.stopPropagation(); selectSource(s); };
      list.appendChild(div);
    });
  }
  function toggleSourceList(){
    sourceListOpen = !sourceListOpen;
    document.getElementById('sourceList').classList.toggle('open', sourceListOpen);
    document.getElementById('sourceCaret').classList.toggle('open', sourceListOpen);
    if(sourceListOpen && ampListOpen){ toggleAmpList(); }
  }
  function selectSource(s){
    currentSource = s.name;
    document.getElementById('sourceRowName').textContent = s.name;
    document.getElementById('volSourceChip').textContent = s.name;
    renderSourceList();
    toggleSourceList();
  }

  function onVolInput(v){ vol = Number(v); updateVolDisplay(); }
  function stepVol(delta){
    vol = Math.max(MIN_DB, Math.min(MAX_DB, vol + delta));
    document.getElementById('volSlider').value = vol;
    updateVolDisplay();
  }
  function updateVolDisplay(){
    document.getElementById('volValue').textContent = vol.toFixed(1);
    const pct = ((vol - MIN_DB) / (MAX_DB - MIN_DB)) * 100;
    document.getElementById('volSlider').style.setProperty('--fill', pct + '%');
  }

  function toggleMute(){
    muted = !muted;
    document.getElementById('muteBtn').classList.toggle('active', muted);
  }
  const BOOT_DURATION_MS = 3200; // mockup only — real duration comes from actual amp status, not a timer

  function setPowerVisualState(state){
    // state: 'on' | 'off' | 'booting'
    const btn = document.getElementById('powerBtn');
    const dot = document.getElementById('ampDot');
    const sub = document.getElementById('ampSub');
    const icon = document.getElementById('powerIcon');
    const spinner = document.getElementById('powerSpinner');
    const label = document.getElementById('powerLabel');

    btn.classList.remove('state-on','state-off','state-booting');
    dot.classList.remove('booting');
    dot.style.opacity = '1';

    if(state === 'on'){
      btn.classList.add('state-on');
      label.textContent = 'Power Off';
      icon.style.display = '';
      spinner.style.display = 'none';
      sub.textContent = '192.168.0.22 · Connected';
    } else if(state === 'off'){
      btn.classList.add('state-off');
      label.textContent = 'Power On';
      icon.style.display = '';
      spinner.style.display = 'none';
      dot.style.opacity = '0.3';
      sub.textContent = '192.168.0.22 · Off';
    } else if(state === 'booting'){
      btn.classList.add('state-booting');
      label.textContent = 'Powering on…';
      icon.style.display = 'none';
      spinner.style.display = '';
      dot.classList.add('booting');
      sub.textContent = 'Booting…';
    }
  }

  function togglePower(){
    if(poweredOn){
      // Power-off is fast on the real amp — reflect it immediately.
      poweredOn = false;
      setPowerVisualState('off');
    } else {
      // Power-on takes real time on the amp — show an intermediate
      // "booting" state rather than jumping straight to "on".
      setPowerVisualState('booting');
      setTimeout(()=>{
        poweredOn = true;
        setPowerVisualState('on');
      }, BOOT_DURATION_MS);
    }
  }

  function toggleFlyout(){
    const wrap = document.getElementById('flyoutWrap');
    wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
  }

  renderAmpHeader();
  renderAmpList();
  renderSourceList();
  updateVolDisplay();
  document.getElementById('flyoutPanel').classList.add('blur-enabled');

  // Both popups reparent into Overlay.overlay in the real widget and
  // close on an outside press — mirrored here at the document level.
  document.addEventListener('click', (e)=>{
    if(ampListOpen && !e.target.closest('#ampList') && !e.target.closest('#ampHeader')){
      toggleAmpList();
    }
    if(sourceListOpen && !e.target.closest('#sourceList') && !e.target.closest('.source-row')){
      toggleSourceList();
    }
  });
</script>

</body>
</html>
